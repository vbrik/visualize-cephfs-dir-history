[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dirhistory"
dynamic = ["version"]
description = "Static website charting CephFS directory size history recorded by trackdir"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = ["psycopg[binary]>=3.2"]
keywords = [
    "cephfs",
    "ceph",
    "directory size",
    "disk usage",
    "rbytes",
    "storage monitoring",
    "visualization",
]
classifiers = [
    "Environment :: Web Environment",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Filesystems",
    "Topic :: System :: Monitoring",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
dirhistory-generate = "dirhistory.generate:main"

[tool.setuptools.dynamic]
version = { attr = "dirhistory.__version__" }

[tool.ruff]
target-version = "py312"
extend-exclude = ["*.md"]  # ruff would otherwise reformat code blocks in docs

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
